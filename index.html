<title>交易单生成器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: form on the left, live card preview pinned on the right; stacks to one column on phones. */
:root {
  --bg: #f1f3f5;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #6a727d;
  --line: #e1e4e8;
  --field: #f6f7f9;
  --btn-bg: #15181d;
  --btn-fg: #ffffff;
  --warn: #b4531a;
  --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-num: "JetBrains Mono", "SF Mono", Menlo, Consolas, "Noto Sans SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e11; --surface: #15181c; --ink: #eceef1; --muted: #8b929c; --line: #262b31;
    --field: #1d2126; --btn-bg: #eceef1; --btn-fg: #101216; --warn: #e8955a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e11; --surface: #15181c; --ink: #eceef1; --muted: #8b929c; --line: #262b31;
  --field: #1d2126; --btn-bg: #eceef1; --btn-fg: #101216; --warn: #e8955a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
legend { padding: 0; margin-bottom: 10px; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; min-width: 0;
}
select { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; min-width: 0; }
.live { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.live { padding:18px 20px; border-radius:18px; background:linear-gradient(135deg,var(--surface),var(--field)); }
.live .l1 { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
.live .sym { font-size: 13px; color: var(--muted); font-family: var(--font-num); }
.live .px { font-family: var(--font-num); font-size: 24px; font-weight: 700; }
.live .chg { font-family: var(--font-num); font-size: 14px; font-weight: 700; }
.live .cs { display: flex; flex-wrap: wrap; gap: 6px; }
.live .c { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); color: var(--ink); }
.live .c.hit { border-color: var(--warn); color: var(--warn); }
.live .px { font-size:32px; letter-spacing:-.04em; }
.live .chg { padding:4px 10px; border-radius:999px; background:var(--field); }
.live .liveMeta { display:flex; justify-content:space-between; gap:8px; align-items:center; color:var(--muted); font-size:12px; }
.live .liveBar { height:6px; border-radius:99px; background:linear-gradient(90deg,#e5484d 0 50%,#12a572 50% 100%); position:relative; margin:2px 0; }
.live .liveBar i { position:absolute; top:-3px; width:12px; height:12px; border-radius:50%; background:#5478f6; border:2px solid var(--surface); transform:translateX(-50%); }
.live .c { padding:5px 11px; }
.hotcoins { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.hotcoins button { border:1px solid var(--line); border-radius:999px; padding:7px 13px; background:var(--field); color:var(--ink); font:inherit; font-size:13px; cursor:pointer; transition:transform .15s, border-color .15s, background .15s; }
.hotcoins button:hover { transform:translateY(-1px); border-color:#5478f6; }
.hotcoins button[aria-pressed=true] { background:#eaf0ff; border-color:#5478f6; color:#3155d9; font-weight:700; }
:root[data-theme="dark"] .hotcoins button[aria-pressed=true] { background:#202d53; color:#b9c8ff; }
.market-card { border-radius:16px !important; box-shadow:0 12px 32px rgba(23,34,58,.08); }
.stage { gap:14px; }
.live { border-left:4px solid #5478f6; box-shadow:0 8px 24px rgba(23,34,58,.06); }
.live .l1 { align-items:center; gap:8px 14px; }
.live .px { font-size:38px; }
.live .quoteGrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.live .quoteTile { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0; }
.live .quoteTile small { display:block; color:var(--muted); font-size:11px; }
.live .quoteTile b { display:block; margin-top:3px; font:700 15px var(--font-num); overflow:hidden; text-overflow:ellipsis; }
.live .rangeTrack { height:10px; position:relative; border-radius:9px; background:linear-gradient(90deg,#e5484d,#e9b94e 50%,#12a572); margin:8px 2px; }
.live .rangeTrack i { position:absolute; top:-4px; width:18px; height:18px; border:3px solid var(--surface); border-radius:50%; background:#3155d9; box-shadow:0 1px 5px #0005; transform:translateX(-50%); }
.live .rangeEnds { display:flex; justify-content:space-between; color:var(--muted); font:500 11px var(--font-num); }
input.num { font-family: var(--font-num); font-weight: 500; }
textarea { resize: vertical; min-height: 64px; }
input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 8px 6px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
.opts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; }
.opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.warn { color: var(--warn); font-size: 13px; min-height: 1.3em; }
.btn { font: inherit; font-size: 15px; font-weight: 700; border: 1px solid transparent; border-radius: 10px; padding: 12px 16px; cursor: pointer; background: var(--btn-bg); color: var(--btn-fg); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.small { padding: 8px 12px; font-size: 13px; }
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-size: 14px; font-weight: 500; }
.bn { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.bn .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 0; }
.hint code { font-family: var(--font-num); font-size: 12px; background: var(--field); padding: 1px 5px; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 13px; font-family: var(--font-num); background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.stage { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage canvas { width: 100%; height: auto; aspect-ratio: 4 / 5; display: block; border-radius: 10px; border: 1px solid var(--line); background: #fff; max-width: 100%; }
.actions { display: flex; gap: 8px; }
.actions .btn { flex: 1; }
.dock { display: none; }
#sheet, #xsheet { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 12, .72); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#sheet .box, #xsheet .box { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 14px; max-width: 460px; width: 100%; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
#sheet img { width: 100%; height: auto; border-radius: 8px; display: block; -webkit-touch-callout: default; user-select: auto; }
#sheet .msg { font-size: 13px; color: var(--muted); text-align: center; min-height: 1.4em; }
#xsheet .box { max-width: 560px; }
#xText { min-height: 220px; font-family: var(--font-num); font-size: 12px; }
.tp { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 36px; gap: 8px; align-items: end; }
.tp .tag { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-bottom: -3px; }
.tp .x { font: inherit; border: 1px solid var(--line); background: var(--field); color: var(--muted); border-radius: 9px; height: 42px; cursor: pointer; }
.toast { font-size: 13px; color: var(--muted); min-height: 1.4em; text-align: center; }
.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.hist h2 { margin: 0; font-size: 16px; }
.hhead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-family: var(--font-num); font-weight: 700; }
.hbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.hlist { display: flex; flex-direction: column; }
.hi { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.hi img { width: 64px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--field); }
.hi .meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hi .t1 { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.hi .sym { font-family: var(--font-num); font-weight: 700; }
.hi .sub { font-size: 12.5px; color: var(--muted); font-family: var(--font-num); }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.win { color: #12a572; border-color: #12a572; } .pill.loss { color: #e5484d; border-color: #e5484d; }
.hi .ops { display: flex; flex-wrap: wrap; gap: 6px; }
.hi .ops button { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; }
.hi .ops button[aria-pressed=true] { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.empty { font-size: 13px; color: var(--muted); padding: 8px 0; }
@media (max-width: 860px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; }
  .stage .actions { display: none; }
  .dock { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  body { padding-bottom: 96px; }
  .dock { display: flex; gap: 8px; }
  .dock .btn { flex: 1; width: auto; }
}
@media (max-width: 420px) { .tp { grid-template-columns: minmax(0,1fr) minmax(0,1fr) 32px; gap: 6px; }
 .row.keep { grid-template-columns: minmax(0, 1fr); } }

<main class="wrap">
  <header>
    <h1>交易单生成器</h1>
    <p>填写进场、止盈、止损，右侧实时生成可保存的交易单图片。</p>
  </header>

  <div class="grid">
    <form class="panel" id="form" autocomplete="off">
      <fieldset>
        <legend>品种与方向</legend>
        <div class="row">
          <label class="f">交易对<input type="text" id="symbol" class="num" placeholder="选择热门币种或输入代码" autocapitalize="characters"></label>
          <label class="f">副标题<input type="text" id="subtitle" placeholder="USDT 永续"></label>
        </div>
        <div class="hotcoins" id="hotCoins" aria-label="热门币种快捷选择">
          <button type="button" data-symbol="BTCUSDT">₿ BTC</button><button type="button" data-symbol="ETHUSDT">◆ ETH</button><button type="button" data-symbol="BNBUSDT">◆ BNB</button><button type="button" data-symbol="SOLUSDT">◎ SOL</button><button type="button" data-symbol="XRPUSDT">X XRP</button><button type="button" data-symbol="DOGEUSDT">Ð DOGE</button><button type="button" data-symbol="ADAUSDT">₳ ADA</button><button type="button" data-symbol="LINKUSDT">⬡ LINK</button>
        </div>
        <div class="seg" role="group" aria-label="方向" data-key="dir">
          <button type="button" data-v="long">做多</button>
          <button type="button" data-v="short">做空</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>点位</legend>
        <div class="row keep">
          <label class="f">进场区间 起<input type="text" id="entryLo" class="num" inputmode="decimal"></label>
          <label class="f">进场区间 止（可空）<input type="text" id="entryHi" class="num" inputmode="decimal"></label>
          <label class="f">止损<input type="text" id="sl" class="num" inputmode="decimal"></label>
          <label class="f">仓位<input type="text" id="size" placeholder="0.3倍 / 10x / 5%"></label>
        </div>
        <div id="tpList" style="display:flex;flex-direction:column;gap:8px"></div>
        <div><button type="button" class="btn ghost small" id="btnAddTp">+ 添加止盈位</button></div>
        <div class="warn" id="warn" role="status"></div>
      </fieldset>

      <fieldset>
        <legend>本单结果</legend>
        <div class="seg" role="group" aria-label="结果" data-key="result">
          <button type="button" data-v="pending">进行中</button>
          <button type="button" data-v="win">盈利</button>
          <button type="button" data-v="loss">亏损</button>
          <button type="button" data-v="be">保本</button>
        </div>
        <label class="f">结果说明（可空）<input type="text" id="resultText" placeholder="例如 +3.2% / TP1 平七成"></label>
      </fieldset>

      <fieldset>
        <legend>文字</legend>
        <label class="f">署名<input type="text" id="author" placeholder="你的昵称"></label>
        <label class="f">备注<textarea id="note" rows="2" placeholder="例如：小仓位尝试；打到第一止盈后平七成，剩余挂保本。"></textarea></label>
        <label class="f">风险提示<textarea id="disclaimer" rows="2"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>样式</legend>

  function buildJson() { return JSON.stringify({ app: 'trade-card', version: 1, items: hist.map(function (h) { return { id: h.id, card: h.card }; }) }, null, 2); }
  var xFile = { name: '', text: '', mime: '' };
  function openExport(kind) {
    if (!hist.length) { toast('历史是空的，没有可导出的内容。'); return; }
    var d = new Date(), tag = d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate());
    if (kind === 'csv') xFile = { name: 'trades-' + tag + '.csv', text: '﻿' + buildCsv(), mime: 'text/csv;charset=utf-8' };
    else xFile = { name: 'trades-' + tag + '.json', text: buildJson(), mime: 'application/json' };
    $('xText').value = xFile.text.replace(/^﻿/, ''); $('xMsg').textContent = '共 ' + hist.length + ' 单。'; $('xsheet').hidden = false;
  }
  $('btnExpCsv').addEventListener('click', function () { openExport('csv'); });
  $('btnExpJson').addEventListener('click', function () { openExport('json'); });
  $('xClose').addEventListener('click', function () { $('xsheet').hidden = true; });
  $('xsheet').addEventListener('click', function (e) { if (e.target === $('xsheet')) $('xsheet').hidden = true; });
  $('xDl').addEventListener('click', function () {
    try {
      var a = document.createElement('a'), u = URL.createObjectURL(new Blob([xFile.text], { type: xFile.mime }));
      a.href = u; a.download = xFile.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000);
      $('xMsg').textContent = '如果没有开始下载，请用“复制内容”粘贴到文件里保存。';
    } catch (e) { $('xMsg').textContent = '当前环境不能下载，请用“复制内容”。'; }
  });
  $('xCopy').addEventListener('click', function () {
    var ta = $('xText');
    function fallback() { ta.focus(); ta.select(); $('xMsg').textContent = '已选中内容，请按 Ctrl/Cmd+C 复制。'; }
    try { navigator.clipboard.writeText(xFile.text.replace(/^﻿/, '')).then(function () { $('xMsg').textContent = '已复制。'; }).catch(fallback); } catch (e) { fallback(); }
  });
  $('btnImp').addEventListener('click', function () { $('impFile').click(); });
  $('impFile').addEventListener('change', function () {
    var f = this.files && this.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) { toast('导入失败：备份文件不能超过 2 MiB。'); this.value = ''; return; }
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var data = JSON.parse(rd.result), items = data.items || data, n = 0, have = {};
        if (!Array.isArray(items) || items.length > 500) throw new Error('备份记录数量无效');
        hist.forEach(function (h) { have[h.id] = 1; });
        var fresh = [];
        items.forEach(function (x) {
          if (!x || !x.card || typeof x.card !== 'object' || typeof x.id !== 'string' || !x.id || have[x.id]) return;
          var c = {}, valid = true;
          CARD_KEYS.forEach(function (k) {
            var v = x.card[k]; if (v === undefined) return;
            if (k === 'tps') { if (!Array.isArray(v) || v.length > MAX_TP) valid = false; else c[k] = v.map(function (t) { return { lo: String((t && t.lo) || '').slice(0, 80), hi: String((t && t.hi) || '').slice(0, 80) }; }); }
            else if (typeof v === 'string') c[k] = v.slice(0, 2000);
            else if (typeof v === 'boolean' || typeof v === 'number' || v === null) c[k] = v;
            else valid = false;
          });
          if (!valid) return;
          CARD_KEYS.forEach(function (k) { if (c[k] === undefined) c[k] = clone(DEFAULTS[k] === undefined ? null : DEFAULTS[k]); });
          c.kl = null;
          fresh.push({ id: x.id.slice(0, 100), card: c, thumb: '' }); have[x.id] = 1; n++;
        });
        hist = hist.concat(fresh).sort(function (a, b) { return String(b.card.ts || '').localeCompare(String(a.card.ts || '')); }).slice(0, MAX_HIST);
        saveHist(); renderHist(); toast('导入 ' + n + ' 单，正在生成缩略图…');
        var chain = Promise.resolve();
        fresh.forEach(function (it) { chain = chain.then(function () { return makeThumb(it.card).then(function (th) { it.thumb = th; }); }); });
        chain.then(function () { saveHist(); renderHist(); toast('导入完成：' + n + ' 单。'); });
      } catch (e) { toast('导入失败：文件不是有效的备份 JSON。'); }
    };
    rd.readAsText(f); this.value = '';
  });
  $('btnClear').addEventListener('click', function () {
    var b = $('btnClear');
    if (b.getAttribute('data-ask') !== '1') { b.setAttribute('data-ask', '1'); b.textContent = '再点一次确认清空'; setTimeout(function () { b.removeAttribute('data-ask'); b.textContent = '清空'; }, 4000); return; }
    hist = []; currentId = null; saveHist(); renderHist(); b.removeAttribute('data-ask'); b.textContent = '清空'; toast('历史已清空。');
  });

  /* ---------- image sheet ---------- */
  var lastUrl = '';
  function showSheet(url) { lastUrl = url; $('outImg').src = url; $('outMsg').textContent = '手机长按图片保存，电脑右键图片另存为。'; $('sheet').hidden = false; }
  function generate() {
    var card = snapshot(); card.ts = stamp();
    ensureFonts(card).then(function () {
      draw(); var url = cv.toDataURL('image/png');
      makeThumb(card).then(function (th) { var ok = upsert(th); toast(ok ? '已自动保存到历史。' : '图片已生成，但浏览器存储已满，历史没有缩略图。'); });
      showSheet(url);
    });
  }
  function openImage(card) {
    ensureFonts(card).then(function () { drawCard(off, card); var u = off.toDataURL('image/png'); ctx = cv.getContext('2d'); showSheet(u); });
  }
  $('btnGen').addEventListener('click', generate);
  $('btnGen2').addEventListener('click', generate);
  $('btnSave').addEventListener('click', function () { persistCurrent(); });
  $('btnSave2').addEventListener('click', function () { persistCurrent(); });
  $('btnNew').addEventListener('click', function () {
    currentId = null; S.result = 'pending'; S.resultText = ''; syncForm(); toast('已开始新的一单，保存后会新增一条记录。');
  });
  $('btnClose').addEventListener('click', function () { $('sheet').hidden = true; });
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) $('sheet').hidden = true; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('sheet').hidden = true; $('xsheet').hidden = true; } });
  $('btnDl').addEventListener('click', function () {
    try {
      var a = document.createElement('a');
      a.href = lastUrl; a.download = (normSymbol(S.symbol) || 'trade') + '-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      $('outMsg').textContent = '如果没有开始下载，请长按或右键图片保存。';
    } catch (e) { $('outMsg').textContent = '请长按或右键图片保存。'; }
  });
  $('btnCopy').addEventListener('click', function () {
    fetch(lastUrl).then(function (r) { return r.blob(); }).then(function (blob) {
      return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    }).then(function () { $('outMsg').textContent = '已复制到剪贴板。'; })
      .catch(function () { $('outMsg').textContent = '浏览器拒绝了复制，请长按或右键图片保存。'; });
  });

  /* ---------- Binance actions ---------- */
  function say(msg) { $('bstat').textContent = msg; }
  function fillLevels(p, dir) {
    var k = dir === 'long' ? 1 : -1;
    S.entryLo = fmt(p * 0.9975); S.entryHi = fmt(p * 1.0025);
    S.tps = [{ lo: fmt(p * (1 + 0.03 * k)), hi: fmt(p * (1 + 0.045 * k)) }];
    S.sl = fmt(p * (1 - 0.025 * k));
    syncForm();
  }
  $('btnPrice').addEventListener('click', function () {
    var sym = normSymbol(S.symbol);
    if (!sym) { say('先填写交易对，例如 ETHUSDT。'); return; }
    say('正在获取 ' + sym + ' 现价…');
    Binance.ticker(sym).then(function (t) {
      lastTicker = t; fillLevels(t.price, S.dir);
      say(sym + ' 现价 ' + fmt(t.price) + '。已按现价生成示例点位，请按你的计划修改。');
    }).catch(function (e) { say('获取失败：' + Binance.explain(e)); });
  });
  $('btnKl').addEventListener('click', function () {
    var sym = normSymbol(S.symbol);
    if (!sym) { say('先填写交易对，例如 ETHUSDT。'); return; }
    say('正在加载 ' + sym + ' ' + S.bnIv + ' K线…');
    Promise.all([Binance.klines(sym, S.bnIv, 60), Binance.ticker(sym).catch(function () { return null; })]).then(function (r) {
      S.kl = { sym: sym, iv: S.bnIv, mk: S.market, d: r[0] }; S.showChart = true; $('showChart').checked = true; if (r[1]) lastTicker = r[1];
      save(); schedule(); say('已加载 ' + r[0].length + ' 根K线，图表已加入交易单。换交易对后需要重新加载。');
    }).catch(function (e) { say('加载失败：' + Binance.explain(e)); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#hotCoins [data-symbol]'), function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-symbol') === normSymbol(S.symbol)));
    b.addEventListener('click', function () {
      S.symbol = b.getAttribute('data-symbol'); $('symbol').value = S.symbol; save();
      Array.prototype.forEach.call(document.querySelectorAll('#hotCoins [data-symbol]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      $('btnKl').click();
    });
  });
  function tick() {
    if (document.hidden) return;
    var sym = normSymbol(S.symbol); if (!sym) return;
    Binance.ticker(sym).then(function (t) {
      lastTicker = t; renderLive(t);
    }).catch(function (e) { say('实时刷新失败：' + Binance.explain(e)); });
  }
  $('liveOn').addEventListener('change', function () {
    clearInterval(liveTimer); liveTimer = null;
    if (this.checked) { tick(); liveTimer = setInterval(tick, 1000); } 
  });
  $('btnPos').addEventListener('click', function () {
    var box = $('posList'); box.textContent = '';
    say('正在读取持仓…');
    Binance.positions().then(function (list) {
      if (!list.length) { say('没有持仓。'); return; }
      say('点击一个持仓填入交易单。');
      list.forEach(function (p) {
        var b = document.createElement('button'); b.type = 'button';
        var amt = parseFloat(p.positionAmt), dir = amt > 0 ? 'long' : 'short';
        b.textContent = p.symbol + ' ' + (dir === 'long' ? '多' : '空') + (p.leverage ? ' ' + p.leverage + 'x' : '');
        b.addEventListener('click', function () {
          S.symbol = p.symbol; S.dir = dir; if (p.leverage) S.size = p.leverage + 'x';
          var ep = parseFloat(p.entryPrice);
          if (isFinite(ep)) fillLevels(ep, dir); else syncForm();
        });
        box.appendChild(b);
      });
    }).catch(function (e) { say('读取失败：' + (e && e.message ? e.message : '网络请求被拒绝')); });
  });

  buildTps(); renderHist(); schedule();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fontKey = ''; ensureFonts().then(draw); });
  // thumbnails missing from older/imported items
  hist.forEach(function (it) { if (!it.thumb) makeThumb(it.card).then(function (th) { it.thumb = th; saveHist(); renderHist(); }); });
})();
</script>
